<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Login</title>
</head>
<body class="pagina-produtos">
  <header>
    <nav class="navbar navbar-dark bg-dark fixed-top">
      <div class="container-fluid">
        <a class="navbar-brand">
          <img src="logo.png" height="75">
        </a>
        <button id="user-info" class="navbar-toggler" type="button" data-bs-toggle="offcanvas"
          data-bs-target="#offcanvasDarkNavbar" aria-controls="offcanvasDarkNavbar" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="offcanvas offcanvas-end text-bg-dark" tabindex="-1" id="offcanvasDarkNavbar" aria-labelledby="offcanvasDarkNavbarLabel">
          <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="nav-link">Opções</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
          </div>
          <div class="offcanvas-body">
            <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="index.html">Produtos</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="carrinho.html">Carrinho</a>
              </li>
              <li id="nav-login" class="nav-item">
                <a class="nav-link" href="login.html">Realize o login</a>
              </li>
              <li class="nav-item dropdown">
                <a id="cli-info" class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"aria-expanded="false">
                  Nome
                </a>
                <ul class="dropdown-menu dropdown-menu-dark">
                  <li><a class="dropdown-item" href="cadastro.html">Perfil</a></li>
                  <li>
                    <hr class="dropdown-divider">
                  </li>
                  <li><a class="dropdown-item" href="#" onclick="logout()">Sair</a></li>
                </ul>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </nav>
  </header>
    <main class="d-flex flex-column align-items-center">
      <div id="busca-produtos">
        <form id="form-busca">
            <div class="campo-busca">
                <label for="input-busca">Buscar produto:</label>
                <input
                    type="text"
                    id="input-busca"
                    placeholder="Nome do livro">
            </div>
            <div class="campo-busca">
                <label for="input-categoria">Categoria:</label>
                <input
                    type="text"
                    id="input-categoria"
                    placeholder="Categoria">
            </div>
            <div class="campo-busca">
                <label for="preco-min">Preço mínimo:</label>
                <input
                    type="number"
                    id="preco-min"
                    min="0"
                    step="0.01"
                    placeholder="R$ 0,00">
            </div>
            <div class="campo-busca">
                <label for="preco-max">Preço máximo:</label>
                <input
                    type="number"
                    id="preco-max"
                    min="0"
                    step="0.01"
                    placeholder="R$ 0,00">
            </div>
            <div class="campo-busca">
                <label for="select-ordem">Ordenar por:</label>
                <select id="select-ordem">
                    <option value="">Sem ordenação</option>
                    <option value="menor preco">
                        Menor preço
                    </option>
                    <option value="maior preco">
                        Maior preço
                    </option>
                </select>
              </div>
            <button
                type="button"
                class="btn_enviar"
                onclick="carregar_produtos(true)">
                Buscar
            </button>
            <button
                type="button"
                class="btn-limpar"
                onclick="limpar_filtros()" >
                Limpar filtros
            </button>
        </form>
    </div>
    <div id="produtos"></div>
        <nav
            id="paginacao"
            class="paginacao"
            aria-label="Paginação de produtos">
        </nav>
    </main>
    <footer>

    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    
    <script src="./pages.js"></script>
    <script src="api.js"></script>
    <script src="index.js"></script>
</body>
</html>
