<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Login</title>
</head>
<body>
  <header>
    <nav class="navbar navbar-dark bg-dark fixed-top">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Books</a>
        <button id="user-info"class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasDarkNavbar" aria-controls="offcanvasDarkNavbar" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="offcanvas offcanvas-end text-bg-dark" tabindex="-1" id="offcanvasDarkNavbar" aria-labelledby="offcanvasDarkNavbarLabel">
          <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="nav-link">Realize o login</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
          </div>
          <div class="offcanvas-body">
            <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="index.html">Produtos</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="carrinho.html">Carrinho</a>
              </li>
                <li id="nav-login" class="nav-item">
                  <a class="nav-link" href="login.html">Faça login</a>
                </li>
                <li class="nav-item dropdown">
                  <a id="cli-info" class="nav-link dropdown-toggle"  href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                    Nome
                  </a>
                  <ul class="dropdown-menu dropdown-menu-dark">
                    <li><a class="dropdown-item" href="cadastro.html">Perfil</a></li>
                    <li>
                      <hr class="dropdown-divider">
                    </li>
                    <li><a class="dropdown-item" href="#" onclick="logout()">Sair</a></li>
                  </ul>
                </li>
              </ul>
            </div>
          </div>
        </div>
      </nav>
</header>
    <main>
        <h1>Login</h1>
        <form id="form_login">
            <label for="email">Email</label>
            <input type="email" id="email" required class="input_texto">
            <label for="senha">Senha</label>
            <input type="password" id="senha" required>
            <p>Não possui cadastro? Cadastre-se <a href="cadastro.html">aqui</a></p>

            <input type="submit" id="btn_entrar" value="Entrar" class="btn_entrar">
        </form>
    </main>
    <footer>

    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
      function pegar_dados_login(){
      const dados_login = {
        email: document.getElementById("email").value,
        senha: document.getElementById("senha").value
      }
      return dados_login
    }

    const form_login = document.getElementById("form_login")
    const btn_entrar = document.getElementById("btn_entrar") 
    form_login.addEventListener("submit", async (event)=>{
        localStorage.removeItem("nome_cliente")
        localStorage.removeItem("token")
        event.preventDefault()
        btn_entrar.disabled = true
        btn_entrar.value = "Realizando login..."

        const dados_login = pegar_dados_login()

        try{
          const resposta = await fetch("http://localhost:3000/login", {
              method: "POST",
              headers: { "Content-Type": "application/json"},
              body: JSON.stringify(dados_login)
          })
          const json_resposta = await resposta.json()
            if (!resposta.ok){
              if (resposta.status == 401) {
                throw new Error (json_resposta.msg)
              } else {
                throw new Error("Erro insesperado na API")
              }
            }
            localStorage.setItem("nome_cliente", json_resposta.nome)
            localStorage.setItem("token", json_resposta.token)
            window.location.href = "index.html"
        } catch(error){
            alert(error)
        } finally {
            btn_entrar.value = "Entrar"
            btn_entrar.disabled = false
        }
    })
  </script>
  <script src="./pages.js"></script>
</body>
</html>
