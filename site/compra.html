<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="style.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <title>Finalizar compra</title>
</head>

<body>

    <header>

        <nav class="navbar navbar-dark bg-dark fixed-top">

            <div class="container-fluid">

                <a class="navbar-brand" href="index.html">
                    <img src="logo.png" height="75" alt="Logo">
                </a>

                <button class="navbar-toggler" type="button"
                    data-bs-toggle="offcanvas"
                    data-bs-target="#offcanvasDarkNavbar">

                    <span class="navbar-toggler-icon"></span>

                </button>

                <div class="offcanvas offcanvas-end text-bg-dark" tabindex="-1"
                    id="offcanvasDarkNavbar">

                    <div class="offcanvas-header">

                        <h5 class="offcanvas-title">Opções</h5>

                        <button type="button" class="btn-close btn-close-white"
                            data-bs-dismiss="offcanvas">
                        </button>

                    </div>

                    <div class="offcanvas-body">

                        <ul class="navbar-nav">

                            <li class="nav-item">
                                <a class="nav-link" href="index.html">Produtos</a>
                            </li>

                            <li class="nav-item">
                                <a class="nav-link" href="carrinho.html">Carrinho</a>
                            </li>

                            <li class="nav-item">
                                <a class="nav-link active" href="compra.html">Finalizar compra</a>
                            </li>

                            <li id="nav-login" class="nav-item">
                                <a class="nav-link" href="login.html">Realize o login</a>
                            </li>

                            <li class="nav-item dropdown">

                                <a id="cli-info" class="nav-link dropdown-toggle"
                                    href="#" role="button" data-bs-toggle="dropdown">
                                    Nome
                                </a>

                                <ul class="dropdown-menu dropdown-menu-dark">

                                    <li>
                                        <a class="dropdown-item" href="cadastro.html">Perfil</a>
                                    </li>

                                    <li><hr class="dropdown-divider"></li>

                                    <li>
                                        <a class="dropdown-item" href="#" onclick="logout()">Sair</a>
                                    </li>

                                </ul>

                            </li>

                        </ul>

                    </div>
                </div>
            </div>
        </nav>

    </header>

    <main class="container" style="padding-top: 120px; max-width: 800px;">

        <h1 class="text-center mb-4">Finalizar compra</h1>

        <!-- Resumo do pedido -->
        <section class="mb-4">

            <h3>Resumo do pedido</h3>

            <div id="lista-produtos" class="list-group mb-3">

            </div>

            <div class="d-flex justify-content-between align-items-center">

                <h4>Total:</h4>

                <h4 id="valor-total">R$ 0,00</h4>

            </div>

        </section>

        <hr>

        <!-- Pagamento -->
        <section>

            <h3>Forma de pagamento</h3>

            <form id="form_compra">

                <div class="mb-3">

                    <label for="forma_pagamento" class="form-label">
                        Selecione a forma de pagamento:
                    </label>

                    <select id="forma_pagamento" class="form-select" required>

                        <option value="">Selecione...</option>

                        <option value="PIX">PIX</option>

                        <option value="Dinheiro">Dinheiro</option>

                        <option value="Cartão de crédito">Cartão de crédito</option>

                        <option value="Cartão de débito">Cartão de débito</option>

                    </select>

                </div>

                <div class="d-flex flex-wrap gap-2">

                    <a href="carrinho.html" class="btn btn-secondary">
                        Voltar ao carrinho
                    </a>

                    <button type="submit" id="btn_enviar"
                        class="btn btn-success flex-grow-1">
                        Finalizar compra
                    </button>

                </div>

            </form>

        </section>

        <!-- Toast -->
        <div class="position-fixed top-50 start-50 translate-middle"
            style="z-index: 1050;">

            <div id="liveToast"
                class="toast align-items-center text-white bg-success border-0"
                role="alert" aria-live="assertive" aria-atomic="true"
                data-bs-delay="5000">

                <div class="d-flex">

                    <div class="toast-body" id="toast-message">
                        Mensagem
                    </div>

                    <button type="button"
                        class="btn-close btn-close-white me-2 m-auto"
                        data-bs-dismiss="toast">
                    </button>

                </div>

            </div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script src="./pages.js"></script>

    <script src="./compra.js"></script>

</body>
</html>
